packages:
  - "packages/core"
  - "packages/highlighter"
  - "packages/models"
  - "packages/runtimes/*"
  - "packages/renderers/*"
  - "packages/themes/*"
  - "apps/*"

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  protobufjs: false
  vue-demi: true

minimumReleaseAgeExclude:
  - '@virgo-design/icons@0.1.3'
