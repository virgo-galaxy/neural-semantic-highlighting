[project]
name = "docs-preview"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28", "rich>=13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["checks"]
addopts = "-ra -q"
