global:
  scrape_interval: 15s
scrape_configs:
  - job_name: docs-api
    static_configs:
      - targets: ["localhost:8080"]
        labels:
          environment: preview
          region: east
rule_files: [alerts.yml]
labels:
  on: yes
  date: 2026-11-11
  quotedBoolean: "true"
  missing: null
  maximum: .inf
