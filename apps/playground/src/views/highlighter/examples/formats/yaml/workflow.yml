name: Check application
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - name: Run checks
        env:
          NODE_VERSION: ${{ matrix.node }}
        run: |
          echo "Checking with Node ${NODE_VERSION}"
          npm ci
          npm run check
