[package]
name = "code-preview"
version = "0.1.0"
edition = "2024"
description = "A small source rendering service"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[features]
default = ["browser"]
browser = []

[profile.release]
lto = true
codegen-units = 1
