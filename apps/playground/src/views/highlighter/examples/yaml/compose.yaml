services:
  web:
    image: example/docs:latest
    ports:
      - "8080:3000"
    environment:
      NODE_ENV: production
      ENABLE_PREVIEW: "true"
    depends_on:
      database:
        condition: service_healthy
  database:
    image: postgres:17
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U app"]
      interval: 10s
      retries: 5
    volumes:
      - data:/var/lib/postgresql/data
volumes:
  data: {}
