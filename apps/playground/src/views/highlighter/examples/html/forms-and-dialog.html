<dialog id="preferences" open>
  <form method="dialog">
    <fieldset>
      <legend>Reading preferences</legend>
      <label>
        Display name
        <input name="name" autocomplete="nickname" required />
      </label>
      <label>
        <input type="checkbox" name="compact" checked />
        Use compact spacing
      </label>
    </fieldset>
    <button value="save" autofocus>Save changes</button>
  </form>
</dialog>

<details name="help">
  <summary>Where are preferences stored?</summary>
  <p>Preferences belong to your account.</p>
</details>
